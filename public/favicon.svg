<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="shellG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="heartG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgG)"/>

  <!-- Turtle Flippers & Head (Flippers in soft emerald) -->
  <!-- Head -->
  <circle cx="32" cy="13" r="6" fill="#6EE7B7"/>
  <!-- Eyes -->
  <circle cx="30" cy="11.5" r="1" fill="#064E3B"/>
  <circle cx="34" cy="11.5" r="1" fill="#064E3B"/>
  
  <!-- Front Flippers -->
  <path d="M18 20 C10 16 7 24 13 28 C18 31 21 27 21 24 Z" fill="#6EE7B7"/>
  <path d="M46 20 C54 16 57 24 51 28 C46 31 43 27 43 24 Z" fill="#6EE7B7"/>
  
  <!-- Rear Flippers -->
  <path d="M19 44 C13 47 16 54 22 51 C25 49 24 45 22 43 Z" fill="#6EE7B7"/>
  <path d="M45 44 C51 47 48 54 42 51 C39 49 40 45 42 43 Z" fill="#6EE7B7"/>
  
  <!-- Little Tail -->
  <path d="M30 50 L32 55 L34 50 Z" fill="#6EE7B7"/>

  <!-- Turtle Shell (Dome) -->
  <ellipse cx="32" cy="34" rx="17" ry="16" fill="url(#shellG)" stroke="#A7F3D0" stroke-width="1.5"/>

  <!-- Shell Pattern Lines -->
  <path d="M22 34 L42 34 M32 20 L32 48 M25 25 L39 43 M25 43 L39 25" stroke="#047857" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>

  <!-- Central Medical OB Heart Symbol on Shell -->
  <circle cx="32" cy="34" r="8.5" fill="#FFFFFF" shadow="drop-shadow(0 1px 2px rgba(0,0,0,0.2))"/>
  <!-- Stethoscope / Medical Heart -->
  <path d="M32 38.5 C32 38.5 27 35.5 27 32.5 C27 30.5 28.6 29 30.3 29 C31.2 29 31.8 29.5 32 30 C32.2 29.5 32.8 29 33.7 29 C35.4 29 37 30.5 37 32.5 C37 35.5 32 38.5 32 38.5 Z" fill="url(#heartG)"/>
  <path d="M32 31.8 V34.2 M30.8 33 H33.2" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round"/>
</svg>
